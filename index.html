<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.json">
  <title>MKCC Prints</title>
  <style>
    :root { font-family: Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#111; color:#fff; }
    .wrap { max-width:520px; margin:auto; padding:24px; }
    .card { background:#1d1d1d; border:1px solid #333; border-radius:16px; padding:22px; margin-top:20px; }
    h1 { margin:0 0 8px; font-size:32px; }
    p { color:#bbb; }
    input, button { width:100%; padding:13px; margin-top:10px; border-radius:10px; border:1px solid #444; font-size:16px; }
    input { background:#101010; color:#fff; }
    button { background:#fff; color:#111; font-weight:700; cursor:pointer; }
    button.secondary { background:#292929; color:#fff; }
    .hidden { display:none !important; }
    .status { margin-top:14px; min-height:22px; color:#ffcc66; line-height:1.4; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
    .tile { padding:18px; background:#242424; border-radius:14px; border:1px solid #333; }
    .tile strong { display:block; font-size:20px; margin-bottom:5px; }
    .small { font-size:13px; color:#999; }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView">
      <div class="card">
        <h1>MKCC Prints</h1>
        <p>3D printing management system</p>
        <input id="email" type="email" placeholder="Email" autocomplete="email">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Log In</button>
        <button id="signupBtn" class="secondary">Create Account</button>
        <div id="loginStatus" class="status"></div>
      </div>
    </section>

    <section id="appView" class="hidden">
      <div class="card">
        <h1>MKCC Prints</h1>
        <p id="welcome">Dashboard</p>
        <div class="grid">
          <div class="tile"><strong>0</strong><span class="small">Open Orders</span></div>
          <div class="tile"><strong>0</strong><span class="small">Print Jobs</span></div>
          <div class="tile"><strong>0</strong><span class="small">Printers</span></div>
          <div class="tile"><strong>0</strong><span class="small">Spools</span></div>
        </div>
        <button id="logoutBtn" class="secondary">Log Out</button>
      </div>
    </section>
  </main>

  <script type="module">
    // Firebase currently recommends matching CDN versions across Firebase modules.
    // This app uses the current Firebase JS SDK version.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8agDN8iMc06jfb17HypE0BZnfEQeLdG0",
      authDomain: "mkcc-prints-bb164.firebaseapp.com",
      projectId: "mkcc-prints-bb164",
      storageBucket: "mkcc-prints-bb164.firebasestorage.app",
      messagingSenderId: "218476559416",
      appId: "1:218476559416:web:40a2dfe0c70fdced6cbacd",
      measurementId: "G-90KJYY77HK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = id => document.getElementById(id);
    const setStatus = (msg, error=false) => {
      $("loginStatus").textContent = msg;
      $("loginStatus").style.color = error ? "#ff7777" : "#ffcc66";
    };

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) {
        setStatus("Enter your email and password.", true);
        return;
      }
      setStatus("Logging in...");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        setStatus("");
      } catch (e) {
        console.error(e);
        setStatus(e.message || "Login failed.", true);
      }
    });

    $("signupBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) {
        setStatus("Enter an email and password first.", true);
        return;
      }
      if (password.length < 6) {
        setStatus("Firebase requires a password of at least 6 characters.", true);
        return;
      }
      setStatus("Creating account...");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        setStatus("");
      } catch (e) {
        console.error(e);
        setStatus(e.message || "Account creation failed.", true);
      }
    });

    $("logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        $("loginView").classList.add("hidden");
        $("appView").classList.remove("hidden");
        $("welcome").textContent = `Logged in as ${user.email}`;
      } else {
        $("appView").classList.add("hidden");
        $("loginView").classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
