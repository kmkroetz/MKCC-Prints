<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.json">
  <title>MKCC Prints</title>
  <style>
    :root { font-family: Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#111; color:#fff; }
    .wrap { max-width:720px; margin:auto; padding:20px; }
    .card { background:#1d1d1d; border:1px solid #333; border-radius:16px; padding:20px; margin-top:16px; }
    h1 { margin:0 0 8px; font-size:30px; }
    h2 { margin:0 0 12px; }
    p { color:#bbb; }
    input, select, button { width:100%; padding:13px; margin-top:10px; border-radius:10px; border:1px solid #444; font-size:16px; }
    input, select { background:#101010; color:#fff; }
    button { background:#fff; color:#111; font-weight:700; cursor:pointer; }
    button.secondary { background:#292929; color:#fff; }
    button.danger { background:#5b2020; color:#fff; }
    .hidden { display:none !important; }
    .status { margin-top:14px; min-height:22px; color:#ffcc66; line-height:1.4; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
    .tile { padding:18px; background:#242424; border-radius:14px; border:1px solid #333; cursor:pointer; }
    .tile strong { display:block; font-size:26px; margin-bottom:5px; }
    .small { font-size:13px; color:#999; }
    .topbar { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .topbar button { width:auto; margin-top:0; padding:10px 14px; }
    .printer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid #333; }
    .printer:last-child { border-bottom:0; }
    .printer-name { font-weight:700; }
    .printer-model { color:#aaa; font-size:13px; margin-top:4px; }
    .printer-actions { display:flex; gap:8px; }
    .printer-actions button { width:auto; margin-top:0; padding:8px 10px; font-size:13px; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10; }
    .modal-card { width:min(520px,100%); background:#1d1d1d; border:1px solid #444; border-radius:16px; padding:20px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:520px) { .grid,.row { grid-template-columns:1fr; } .printer { align-items:flex-start; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView">
      <div class="card">
        <h1>MKCC Prints</h1>
        <p>3D printing management system</p>
        <input id="email" type="email" placeholder="Email" autocomplete="email">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Log In</button>
        <button id="signupBtn" class="secondary">Create Account</button>
        <div id="loginStatus" class="status"></div>
      </div>
    </section>

    <section id="appView" class="hidden">
      <div class="card">
        <div class="topbar">
          <div>
            <h1>MKCC Prints</h1>
            <p id="welcome">Dashboard</p>
          </div>
          <button id="logoutBtn" class="secondary">Log Out</button>
        </div>

        <div id="dashboardView">
          <div class="grid">
            <div class="tile"><strong id="ordersCount">0</strong><span class="small">Open Orders</span></div>
            <div class="tile"><strong id="jobsCount">0</strong><span class="small">Print Jobs</span></div>
            <div class="tile" id="printersTile"><strong id="printersCount">0</strong><span class="small">Printers</span></div>
            <div class="tile" id="filamentTile"><strong id="spoolsCount">0</strong><span class="small">Spools</span></div>
          </div>
          <button id="printersBtn" class="secondary">Manage Printers</button>
          <button id="filamentBtn" class="secondary">Manage Filament</button>
        </div>

        <div id="filamentView" class="hidden">
          <div class="topbar">
            <h2>Filament & Spools</h2>
            <button id="backFilamentDashboardBtn" class="secondary">Dashboard</button>
          </div>
          <p>Track filament by grams and actual purchase cost.</p>
          <button id="addSpoolBtn">+ Add Spool</button>
          <div id="filamentList"></div>
          <div id="filamentStatus" class="status"></div>
        </div>

        <div id="printersView" class="hidden">
          <div class="topbar">
            <h2>Printers</h2>
            <button id="backDashboardBtn" class="secondary">Dashboard</button>
          </div>
          <p>These printers are shared across the MKCC Prints team.</p>
          <button id="addPrinterBtn">+ Add Printer</button>
          <div id="printersList"></div>
          <div id="printerStatus" class="status"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="spoolModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="spoolModalTitle">Add Spool</h2>
      <input id="spoolBrand" placeholder="Brand" value="Inland">
      <input id="spoolMaterial" placeholder="Material" value="PLA Basic">
      <input id="spoolColor" placeholder="Color" value="White">
      <input id="spoolWeight" type="number" min="1" step="1" placeholder="Spool weight (g)" value="1000">
      <input id="spoolPrice" type="number" min="0" step="0.01" placeholder="Price paid ($)" value="10.00">
      <div class="row">
        <button id="saveSpoolBtn">Save Spool</button>
        <button id="cancelSpoolBtn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="printerModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle">Add Printer</h2>
      <input id="printerName" placeholder="Printer name">
      <select id="printerModel">
        <option value="Bambu A1">Bambu A1</option>
        <option value="Bambu P2S">Bambu P2S</option>
        <option value="Bambu P1S">Bambu P1S</option>
        <option value="Ender 3">Ender 3</option>
        <option value="Ender 3 V2">Ender 3 V2</option>
      </select>
      <select id="printerStatusSelect">
        <option value="active">Active</option>
        <option value="offline">Offline</option>
        <option value="maintenance">Maintenance</option>
      </select>
      <div class="row">
        <button id="savePrinterBtn">Save Printer</button>
        <button id="cancelPrinterBtn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      setDoc,
      doc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8agDN8iMc06jfb17HypE0BZnfEQeLdG0",
      authDomain: "mkcc-prints-bb164.firebaseapp.com",
      projectId: "mkcc-prints-bb164",
      storageBucket: "mkcc-prints-bb164.firebasestorage.app",
      messagingSenderId: "218476559416",
      appId: "1:218476559416:web:40a2dfe0c70fdced6cbacd",
      measurementId: "G-90KJYY77HK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    const DEFAULT_PRINTERS = [
      ["black-viper", "Black Viper", "Bambu A1"],
      ["red-viper", "Red Viper", "Bambu A1"],
      ["grey-viper", "Grey Viper", "Bambu P2S"],
      ["chance-1", "Chance 1", "Bambu A1"],
      ["chance-2", "Chance 2", "Bambu A1"],
      ["chance-3", "Chance 3", "Bambu P1S"],
      ["ender-black", "Black", "Ender 3"],
      ["ender-red", "Red", "Ender 3"],
      ["ender-blue", "Blue", "Ender 3 V2"]
    ];

    let currentUser = null;
    let editingPrinterId = null;
    let unsubscribePrinters = null;
    let unsubscribeSpools = null;
    let editingSpoolId = null;

    const setLoginStatus = (msg, error=false) => {
      $("loginStatus").textContent = msg;
      $("loginStatus").style.color = error ? "#ff7777" : "#ffcc66";
    };
    const setFilamentStatus = (msg, error=false) => {
      $("filamentStatus").textContent = msg;
      $("filamentStatus").style.color = error ? "#ff7777" : "#ffcc66";
    };
    const setPrinterStatus = (msg, error=false) => {
      $("printerStatus").textContent = msg;
      $("printerStatus").style.color = error ? "#ff7777" : "#ffcc66";
    };

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) return setLoginStatus("Enter your email and password.", true);
      setLoginStatus("Logging in...");
      try { await signInWithEmailAndPassword(auth, email, password); setLoginStatus(""); }
      catch (e) { console.error(e); setLoginStatus(e.message || "Login failed.", true); }
    });

    $("signupBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) return setLoginStatus("Enter an email and password first.", true);
      if (password.length < 6) return setLoginStatus("Firebase requires a password of at least 6 characters.", true);
      setLoginStatus("Creating account...");
      try { await createUserWithEmailAndPassword(auth, email, password); setLoginStatus(""); }
      catch (e) { console.error(e); setLoginStatus(e.message || "Account creation failed.", true); }
    });

    $("logoutBtn").addEventListener("click", () => signOut(auth));
    $("printersBtn").addEventListener("click", openPrinters);
    $("filamentBtn").addEventListener("click", openFilament);
    $("filamentTile").addEventListener("click", openFilament);
    $("backFilamentDashboardBtn").addEventListener("click", () => {
      $("filamentView").classList.add("hidden");
      $("dashboardView").classList.remove("hidden");
    });
    $("addSpoolBtn").addEventListener("click", () => openSpoolModal());
    $("cancelSpoolBtn").addEventListener("click", closeSpoolModal);
    $("saveSpoolBtn").addEventListener("click", saveSpool);
    $("printersTile").addEventListener("click", openPrinters);
    $("backDashboardBtn").addEventListener("click", () => {
      $("printersView").classList.add("hidden");
      $("dashboardView").classList.remove("hidden");
    });
    $("addPrinterBtn").addEventListener("click", () => openPrinterModal());
    $("cancelPrinterBtn").addEventListener("click", closePrinterModal);
    $("savePrinterBtn").addEventListener("click", savePrinter);

    function openPrinters() {
      $("dashboardView").classList.add("hidden");
      $("filamentView").classList.add("hidden");
      $("printersView").classList.remove("hidden");
      loadPrinters();
    }

    function openFilament() {
      $("dashboardView").classList.add("hidden");
      $("printersView").classList.add("hidden");
      $("filamentView").classList.remove("hidden");
      loadSpools();
    }

    function openSpoolModal(spool=null) {
      editingSpoolId = spool?.id || null;
      $("spoolModalTitle").textContent = spool ? "Edit Spool" : "Add Spool";
      $("spoolBrand").value = spool?.brand || "Inland";
      $("spoolMaterial").value = spool?.material || "PLA Basic";
      $("spoolColor").value = spool?.color || "White";
      $("spoolWeight").value = spool?.originalGrams ?? 1000;
      $("spoolPrice").value = spool?.pricePaid ?? 10;
      $("spoolModal").classList.remove("hidden");
    }

    function closeSpoolModal() {
      editingSpoolId = null;
      $("spoolModal").classList.add("hidden");
    }

    function openPrinterModal(printer=null) {
      editingPrinterId = printer?.id || null;
      $("modalTitle").textContent = printer ? "Edit Printer" : "Add Printer";
      $("printerName").value = printer?.name || "";
      $("printerModel").value = printer?.model || "Bambu A1";
      $("printerStatusSelect").value = printer?.status || "active";
      $("printerModal").classList.remove("hidden");
    }

    function closePrinterModal() {
      editingPrinterId = null;
      $("printerModal").classList.add("hidden");
    }

    async function seedDefaultPrinters() {
      const snap = await getDocs(collection(db, "printers"));
      if (!snap.empty) return;
      await Promise.all(DEFAULT_PRINTERS.map(([id, name, model]) =>
        setDoc(doc(db, "printers", id), {
          name, model, status: "active", createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        })
      ));
    }

    async function seedDefaultSpool() {
      const snap = await getDocs(collection(db, "spools"));
      if (!snap.empty) return;
      await setDoc(doc(db, "spools", "inland-pla-basic-white-001"), {
        brand: "Inland",
        material: "PLA Basic",
        color: "White",
        diameterMm: 1.75,
        originalGrams: 1000,
        remainingGrams: 1000,
        pricePaid: 10,
        costPerGram: 0.01,
        status: "active",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }

    function loadSpools() {
      if (unsubscribeSpools) unsubscribeSpools();
      setFilamentStatus("Loading spools...");
      unsubscribeSpools = onSnapshot(collection(db, "spools"), snap => {
        const spools = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a,b) => String(a.brand + a.material + a.color).localeCompare(String(b.brand + b.material + b.color)));
        $("spoolsCount").textContent = spools.length;
        renderSpools(spools);
        setFilamentStatus(spools.length ? "" : "No spools yet.");
      }, err => {
        console.error(err);
        setFilamentStatus(err.message || "Could not load spools.", true);
      });
    }

    function renderSpools(spools) {
      const list = $("filamentList");
      list.innerHTML = "";
      for (const spool of spools) {
        const row = document.createElement("div");
        row.className = "printer";
        const info = document.createElement("div");
        const cost = Number(spool.costPerGram || 0).toFixed(4);
        info.innerHTML = `<div class="printer-name"></div><div class="printer-model"></div><div class="small"></div>`;
        info.querySelector(".printer-name").textContent = `${spool.brand || "Unknown"} ${spool.material || ""} — ${spool.color || "No color"}`;
        info.querySelector(".printer-model").textContent = `${Number(spool.remainingGrams || 0).toFixed(0)} g remaining of ${Number(spool.originalGrams || 0).toFixed(0)} g`;
        info.querySelector(".small").textContent = `$${Number(spool.pricePaid || 0).toFixed(2)} paid • $${cost}/g`;
        const actions = document.createElement("div");
        actions.className = "printer-actions";
        const edit = document.createElement("button"); edit.textContent = "Edit"; edit.className = "secondary";
        edit.onclick = () => openSpoolModal(spool);
        const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger";
        del.onclick = async () => {
          if (!confirm(`Delete ${spool.brand} ${spool.material} ${spool.color}?`)) return;
          try { await deleteDoc(doc(db, "spools", spool.id)); }
          catch (e) { console.error(e); setFilamentStatus(e.message, true); }
        };
        actions.append(edit, del); row.append(info, actions); list.appendChild(row);
      }
    }

    async function saveSpool() {
      const brand = $("spoolBrand").value.trim();
      const material = $("spoolMaterial").value.trim();
      const color = $("spoolColor").value.trim();
      const originalGrams = Number($("spoolWeight").value);
      const pricePaid = Number($("spoolPrice").value);
      if (!brand || !material || !color || !Number.isFinite(originalGrams) || originalGrams <= 0 || !Number.isFinite(pricePaid) || pricePaid < 0) {
        return alert("Enter a brand, material, color, valid spool weight, and price paid.");
      }
      try {
        const costPerGram = pricePaid / originalGrams;
        if (editingSpoolId) {
          const existing = (await getDocs(collection(db, "spools"))).docs.find(d => d.id === editingSpoolId)?.data() || {};
          const used = Math.max(0, Number(existing.originalGrams || originalGrams) - Number(existing.remainingGrams ?? originalGrams));
          const remainingGrams = Math.max(0, originalGrams - used);
          await updateDoc(doc(db, "spools", editingSpoolId), { brand, material, color, diameterMm: 1.75, originalGrams, remainingGrams, pricePaid, costPerGram, updatedAt: serverTimestamp() });
        } else {
          const id = `${Date.now()}-${brand}-${material}-${color}`.toLowerCase().replace(/[^a-z0-9]+/g,"-");
          await setDoc(doc(db, "spools", id), { brand, material, color, diameterMm: 1.75, originalGrams, remainingGrams: originalGrams, pricePaid, costPerGram, status: "active", createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        }
        closeSpoolModal();
      } catch (e) { console.error(e); alert(e.message || "Could not save spool."); }
    }

    function loadPrinters() {
      if (unsubscribePrinters) unsubscribePrinters();
      setPrinterStatus("Loading printers...");
      unsubscribePrinters = onSnapshot(collection(db, "printers"), snap => {
        const printers = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a,b) => String(a.name).localeCompare(String(b.name)));
        $("printersCount").textContent = printers.length;
        renderPrinters(printers);
        setPrinterStatus(printers.length ? "" : "No printers yet.");
      }, err => {
        console.error(err);
        setPrinterStatus(err.message || "Could not load printers.", true);
      });
    }

    function renderPrinters(printers) {
      const list = $("printersList");
      list.innerHTML = "";
      for (const printer of printers) {
        const row = document.createElement("div");
        row.className = "printer";
        const info = document.createElement("div");
        info.innerHTML = `<div class="printer-name"></div><div class="printer-model"></div><div class="small"></div>`;
        info.querySelector(".printer-name").textContent = printer.name || "Unnamed";
        info.querySelector(".printer-model").textContent = printer.model || "Unknown model";
        info.querySelector(".small").textContent = printer.status || "active";
        const actions = document.createElement("div");
        actions.className = "printer-actions";
        const edit = document.createElement("button"); edit.textContent = "Edit"; edit.className = "secondary";
        edit.onclick = () => openPrinterModal(printer);
        const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger";
        del.onclick = async () => {
          if (!confirm(`Delete ${printer.name}?`)) return;
          try { await deleteDoc(doc(db, "printers", printer.id)); }
          catch (e) { console.error(e); setPrinterStatus(e.message, true); }
        };
        actions.append(edit, del); row.append(info, actions); list.appendChild(row);
      }
    }

    async function savePrinter() {
      const name = $("printerName").value.trim();
      const model = $("printerModel").value;
      const status = $("printerStatusSelect").value;
      if (!name) return alert("Enter a printer name.");
      try {
        if (editingPrinterId) {
          await updateDoc(doc(db, "printers", editingPrinterId), { name, model, status, updatedAt: serverTimestamp() });
        } else {
          const id = `${Date.now()}-${name.toLowerCase().replace(/[^a-z0-9]+/g,"-")}`;
          await setDoc(doc(db, "printers", id), { name, model, status, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        }
        closePrinterModal();
      } catch (e) { console.error(e); alert(e.message || "Could not save printer."); }
    }

    onAuthStateChanged(auth, async user => {
      currentUser = user;
      if (user) {
        $("loginView").classList.add("hidden");
        $("appView").classList.remove("hidden");
        $("welcome").textContent = `Logged in as ${user.email}`;
        try {
          await seedDefaultPrinters();
          await seedDefaultSpool();
          loadPrinters();
        } catch (e) {
          console.error(e);
          setPrinterStatus(e.message || "Firestore setup is not ready yet.", true);
        }
      } else {
        if (unsubscribePrinters) unsubscribePrinters();
        if (unsubscribeSpools) unsubscribeSpools();
        $("appView").classList.add("hidden");
        $("loginView").classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
